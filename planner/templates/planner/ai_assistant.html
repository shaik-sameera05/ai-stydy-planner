{% extends "planner/base.html" %}
{% block content %}
<h1>AI Assistant</h1>
<div class="panel"><form method="post" class="form-grid">{% csrf_token %}<div class="field"><label for="question">Ask a study question</label><textarea id="question" name="question" rows="4" required>{{ question|default:'' }}</textarea></div><button class="btn" type="submit">Ask AI</button></form></div>
{% if result %}<div class="panel" style="margin-top:20px;"><h3>Response</h3><p>{{ result.answer }}</p>{% if result.action %}<p><strong>Action:</strong> {{ result.action }}</p>{% endif %}</div>{% endif %}
{% endblock %}
